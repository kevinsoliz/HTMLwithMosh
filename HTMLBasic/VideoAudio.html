<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video & Audio</title>
    <style>
      video {
        width: 400px;
      }
    </style>
  </head>
  <body>
    <video controls autoplay loop src="videos/blackCat.mp4">
      Your browser does not support the videos.
    </video>
    <!--controls atribute: when is present: true otherwise is false.-->
    <a href="https://caniuse.com/?search=video"
      >Te dice los navegadores que aceptan video.</a
    >
    <audio src=""></audio>
    <!--Es exactamente igual que el video-->
  </body>
</html>
