<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>
    <style>
      table,
      td,
      th {
        border: 1px solid grey;
        border-collapse: collapse;
        padding: 6px;
      }
      tfoot {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <p>Se usan solo para mostrar tabular data no para layouts</p>
    <table>
      <thead>
        <!--Headings y tbodys: Lo usamos par los browser enginers and screen readers, esto es semantic HTML-->
        <tr>
          <th colspan="2">Expenses</th>
        </tr>
        <tr>
          <th>Category</th>
          <!--th: heading-->
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Marketing</td>
          <td>$100</td>
        </tr>
        <tr>
          <td>Accounting</td>
          <td>$200</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th>Total</th>
          <th>$300</th>
        </tr>
      </tfoot>
    </table>
    <p>Software enginering principle: DRY: don't repeat yourself.</p>
  </body>
</html>
