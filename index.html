<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple HTML document template" />
    <meta name="keywords" content="HTML, template, example" />
    <meta name="author" content="Your Name" />
    <title>Mi web</title>
  </head>
  <style>
    em {
      color: red;
      font-style: normal;
    }
  </style>
  <body>
    <p>Hello <em>World</em>!</p>
    <!-- Para hacer enfasis en la palabra "World" en italic, and allow engines to
    extract important content in our document. // Todo lo que qieras hacer con
    el estilo de la fuenta debes hacerlo con CSS, no con HTML. -->
    <p>Hello <i>World</i>!</p>
    <!--También te pondrá la letra en italic, pero esto no se usa.-->
  </body>
</html>
